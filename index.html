<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddy 英语老师</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Buddy is a kids app — default to a bright light theme.
      (() => {
        document.documentElement.setAttribute("data-mode", "light");
        document.documentElement.style.colorScheme = "light";
      })();
    </script>
  </head>
  <body class="h-full bg-kumo-base text-kumo-default antialiased">
    <div id="root" class="h-full"></div>
    <script src="/src/client.tsx" type="module"></script>
    <script>
      // If the app module never mounts (e.g. the bundle failed to download on
      // a flaky connection), show a friendly retry instead of a blank page.
      // Inlined + self-styled so it works even if styles.css failed to load.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;background:#f7f9fc;">' +
            '<div style="max-width:360px;text-align:center;background:#fff;padding:32px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08);">' +
            '<h1 style="margin:0 0 12px;font-size:22px;color:#111827;">加载失败</h1>' +
            '<p style="margin:0 0 20px;color:#6b7280;font-size:14px;line-height:1.6;">页面没能完整加载，可能是网络不太稳定。</p>' +
            '<button onclick="location.reload()" style="background:#4f7cff;color:#fff;border:none;padding:12px 28px;border-radius:14px;font-size:15px;cursor:pointer;">点击重试</button>' +
            '</div></div>';
        }
      }, 10000);
    </script>
  </body>
</html>
